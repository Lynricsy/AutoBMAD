name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Debug SprintOrchestrator
        run: |
          bun -e "
            import { SprintOrchestrator } from './src/core/sprint-orchestrator.js';
            console.log('typeof SprintOrchestrator:', typeof SprintOrchestrator);
            console.log('prototype keys:', Object.getOwnPropertyNames(SprintOrchestrator.prototype));
            console.log('runSprint exists:', typeof SprintOrchestrator.prototype.runSprint);
          "

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
