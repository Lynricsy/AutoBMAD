name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test (CLI, isolated to prevent mock.module leak)
        run: bun test tests/cli/

      - name: Test (unit + integration)
        run: bun test --ignore tests/cli/

      - name: Build
        run: bun run build
